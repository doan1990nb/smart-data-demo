  ok(c, F) { if (!c) return false; if (!Mart.orgOk(c.u, c.r, F)) return false; if (F.seg && F.seg !== 'ALL' && c.seg !== F.seg) return false; if (F.cust && c.c !== F.cust) return false; if (F.xst && F.xst !== 'ALL' && c.status !== F.xst) return false; return true; },
  cases(F) { return (DB.xlrr.cases || []).filter(c => Xlrr.ok(c, F)); },
  recovered(F, from, to) { const cm = Xlrr.caseMap(); let s = 0; for (const t of DB.xlrr.tx || []) if (t[0] >= from && t[0] <= to && Xlrr.ok(cm.get(t[1]), F)) s += t[2]; return s; },
  byCase(F, from, to) { const cm = Xlrr.caseMap(); const m = new Map(); for (const t of DB.xlrr.tx || []) if (t[0] >= from && t[0] <= to && Xlrr.ok(cm.get(t[1]), F)) m.set(t[1], (m.get(t[1]) || 0) + t[2]); return m; },
  remaining(F) { return U.sum(Xlrr.cases(F), c => +c.remaining || 0); },
  // Cam ket / pipeline co ngay du kien trong [from, to]: gia tri ky vong = so cam ket × kha nang thu
  pipeline(F, from, to) { const rs = Xlrr.cases(F).filter(c => c.commit > 0 && c.cdate && c.cdate >= from && c.cdate <= to); return { rows: rs, amount: U.sum(rs, c => +c.commit), expected: U.sum(rs, c => c.commit * (+c.prob || 0) / 100) }; },
  // Cam ket da qua ngay du kien ma chua thu duoc toi thieu 50%
  overdueCommits(F, d) { const bc = Xlrr.byCase(F, U.addDays(d, -45), d); return Xlrr.cases(F).filter(c => c.commit > 0 && c.cdate && c.cdate < d && c.cdate >= U.addDays(d, -45) && (bc.get(c.id) || 0) < c.commit * 0.5); },
};

/* ---------------------------- TRICH LAP DU PHONG ----------------------------
 * Du phong cu the = so thuc te (neu file co) hoac max(0, du no − gia tri khau tru TSBD) × ty le nhom no
 * Du phong chung  = ty le chung × du no nhom 1–4 (uoc tinh)
 * CANH BAO: cong thuc/ty le phai duoc don vi chuyen mon phe duyet truoc khi dung chinh thuc */
const Prov = {
  P() { return DB.meta.prov || DEFAULTS.meta.prov; },
  loanSpec(r) { if (r.pv !== undefined && r.pv !== null && r.pv !== '' && isFinite(r.pv)) return +r.pv; return Math.max(0, r.b - (r.cv || 0)) * (+Prov.P().rates[Math.min(5, Math.max(1, r.g || 1))] || 0) / 100; },
  aggRow(r) { const rt = Prov.P().rates; let v = r[16] || 0; for (let g = 1; g <= 5; g++) v += (r[17 + g] || 0) * (+rt[g] || 0) / 100; return v; },
  required(d, F = {}) { if (!d) return { spec: 0, gen: 0, total: 0, bal: 0 }; const t = Mart.totals(d, 'L', F); const gen = (t.bal - t.g5) * (+Prov.P().general || 0) / 100; return { spec: t.pv, gen, total: t.pv + gen, bal: t.bal, t }; },
  // Chi phi du phong trong ky = so du phong can trich cuoi ky − dau ky (duong = trich them, am = hoan nhap)
  expense(F, from, to) {
    const end = Mart.onOrBefore(to); if (!end) return 0;
    const base = Mart.onOrBefore(U.addDays(from, -1)) || DB.dates.find(x => x >= from && x <= to); if (!base || base === end) return 0;
    return Prov.required(end, F).total - Prov.required(base, F).total;
  },
  // What-if: chuyen cac hop dong cua KH sang nhom moi va/hoac thay doi gia tri khau tru TSBD
  whatIf(snap, F, changes) {
    let before = 0, after = 0; const rt = Prov.P().rates;
    for (const r of snap.loan) {
      if (!Mart.custRowOk(r, F)) continue; const ch = changes[r.c]; const s0 = Prov.loanSpec(r); before += s0;
      if (!ch) { after += s0; continue; }
      const g = ch.g ? +ch.g : r.g, cv = ch.cvPct !== undefined && ch.cvPct !== '' ? r.b * ch.cvPct / 100 : (r.cv || 0);
      after += Math.max(0, r.b - cv) * (+rt[g] || 0) / 100;
    }
    return { before, after, delta: after - before };
  },
};

/* ---------------------------- CHAT LUONG DU NO ---------------------------- */
const Quality = {
  groups(d, F = {}) { const t = Mart.totals(d, 'L', F); return { g: [t.g1, t.g2, t.g3, t.g4, t.g5], bal: t.bal, npl: t.npl, ratio: t.nplRatio, od: t.od }; },
  // Ma tran chuyen nhom theo hop dong giua 2 ngay (so du tai ngay sau). 0 = moi phat sinh, 6 = tat toan
  migration(sA, sB, F = {}) {
    const m = Array.from({ length: 7 }, () => Array(7).fill(0)); const a = new Map(sA.loan.filter(r => Mart.custRowOk(r, F)).map(r => [r.a, r]));
    const seen = new Set();
    for (const r of sB.loan) { if (!Mart.custRowOk(r, F)) continue; const o = a.get(r.a); seen.add(r.a); m[o ? o.g || 1 : 0][r.g || 1] += r.b; }
    for (const [k, o] of a) if (!seen.has(k)) m[o.g || 1][6] += o.b;
    return m;
  },
  // Danh sach khoan chuyen nhom (xau di / cai thien) giua 2 ngay
  moves(sA, sB, F = {}) { const a = new Map(sA.loan.map(r => [r.a, r])); const out = []; for (const r of sB.loan) { if (!Mart.custRowOk(r, F)) continue; const o = a.get(r.a); if (o && (o.g || 1) !== (r.g || 1)) out.push({ ...r, g0: o.g || 1, dir: (r.g || 1) > (o.g || 1) ? 'down' : 'up' }); } return out; },
  // Tin hieu canh bao som — TACH BIET voi ket luan phan loai no
  ews(sD, sM, F = {}) {
    const out = []; const dep0 = Mart.custAgg(sM, 'D', F), dep1 = Mart.custAgg(sD, 'D', F); const ln = Mart.custAgg(sD, 'L', F);
    for (const r of sD.loan) {
      if (!Mart.custRowOk(r, F)) continue;
      if ((r.g || 1) === 1 && r.od > 0 && r.od < 10) out.push({ c: r.c, a: r.a, type: 'OD_N1', sev: 'medium', text: `Khoản ${r.a} nhóm 1 quá hạn ${r.od} ngày`, amt: r.b });
      if ((r.g || 1) === 1 && r.od >= 10) out.push({ c: r.c, a: r.a, type: 'OD10', sev: 'high', text: `Khoản ${r.a} quá hạn ${r.od} ngày nhưng đang ở nhóm 1 — cần rà soát phân loại`, amt: r.b });
      if ((r.g || 1) === 2 && r.od >= 60) out.push({ c: r.c, a: r.a, type: 'N2_LONG', sev: 'high', text: `Khoản ${r.a} nhóm 2 quá hạn ${r.od} ngày — nguy cơ chuyển nợ xấu`, amt: r.b });
    }
    for (const [id, l] of ln) {
      const c = DB.custMap.get(id) || {}; const a0 = dep0.get(id), a1 = dep1.get(id);
      if (c.rank === 'C' && l.maxG === 1 && l.bal >= 3000) out.push({ c: id, type: 'RANK_C', sev: 'low', text: `Xếp hạng C, dư nợ ${U.tyU(l.bal, 2)} vẫn ở nhóm 1`, amt: l.bal });
      if (a0 && a0.bal >= 500 && (!a1 || a1.bal < a0.bal * 0.7)) out.push({ c: id, type: 'DEP_DROP', sev: 'medium', text: `KH vay có tiền gửi giảm ${U.pct((1 - (a1 ? a1.bal : 0) / a0.bal) * 100, 0)} so với đầu kỳ (dòng tiền suy yếu?)`, amt: l.bal });
    }
    return out;
  },
  EWS_NAME: { OD_N1: 'Nhóm 1 quá hạn 1–9 ngày', OD10: 'Quá hạn ≥ 10 ngày, còn nhóm 1', N2_LONG: 'Nhóm 2 quá hạn ≥ 60 ngày', RANK_C: 'Xếp hạng C', DEP_DROP: 'Tiền gửi giảm mạnh' },
};

/* ---------------------------- TAI CHINH ----------------------------
 * DB.fin: [date, unit, code, amount] — THU_KHAC la thu; CP_* la chi (so duong) */
const Fin = {
  items(F, from, to) { const m = {}; for (const r of DB.fin || []) if (r[0] >= from && r[0] <= to && Mart.orgOk(r[1], '', { ...F, rm: '' })) m[r[2]] = (m[r[2]] || 0) + r[3]; return m; },
  result(F, from, to) {
    const L = Mart.accrual('L', F, from, to), D = Mart.accrual('D', F, from, to);
    const nii = L.int - D.int, ctd = L.int - L.ftp, chd = D.ftp - D.int; const useFtp = DB.meta.finUseFtp !== false;
    // Thu ngoai lai/chi phi tinh cung cua so voi du lieu lai: neu ky bat dau truoc ngay du lieu dau tien thi cat tu ngay do (tranh lech ky)
    const f0 = DB.dates[0] && DB.dates[0] > from && DB.dates[0] <= to ? DB.dates[0] : from;
    const lai = useFtp ? ctd + chd : nii; const dv = Svc.sum(F, f0, to);
    // Thu/chi ngoai lai chi phan bo den don vi; loc theo RM/phan khuc thi khong tinh (chua co phuong phap phan bo duoc duyet)
    const rmLevel = (F.rm && F.rm !== 'ALL') || Mart.scope().rm || (F.seg && F.seg !== 'ALL');
    const it = rmLevel ? {} : Fin.items(F, f0, to);
    const thuKhac = it.THU_KHAC || 0, cphd = (it.CP_NV || 0) + (it.CP_QL || 0) + (it.CP_TS || 0) + (it.CP_KHAC || 0);
    const dp = Prov.expense(F, from, to);
    return { L, D, nii, ctd, chd, lai, useFtp, dv, thuKhac, cphd, items: it, dp, kq: lai + dv + thuKhac - cphd - dp, days: L.days, clip: f0 !== from ? f0 : '', partial: rmLevel };
  },
};

/* =====================================================================
 *  KPIX — bo tinh KPI chung cho 7 tru cot
 * ===================================================================== */
const KPIX = {
  list: ['NV', 'DN', 'NPL', 'XLRR', 'DV', 'KQTC', 'DP'],
  def: {
    NV: { name: 'Nguồn vốn', type: 'bal', better: 'up', icon: 'wallet', tone: 'green', page: 'funding', kind: 'D' },
    DN: { name: 'Dư nợ', type: 'bal', better: 'up', icon: 'bank', tone: 'blue', page: 'loans', kind: 'L' },
    NPL: { name: 'Tỷ lệ nợ xấu', type: 'ratio', better: 'down', icon: 'shield', tone: 'red', page: 'quality' },
    XLRR: { name: 'Thu nợ sau XLRR', type: 'flow', better: 'up', icon: 'target', tone: 'amber', page: 'xlrr' },
    DV: { name: 'Thu dịch vụ ròng', type: 'flow', better: 'up', icon: 'chartbar', tone: 'violet', page: 'service' },
    KQTC: { name: 'Kết quả tài chính', type: 'flow', better: 'up', icon: 'profit', tone: 'teal', page: 'finance' },
    DP: { name: 'Chi phí dự phòng', type: 'flow', better: 'down', icon: 'alert', tone: 'red', page: 'provision' },
  },
  has(code) { if (code === 'DV') return Svc.has(); if (code === 'XLRR') return Xlrr.has(); return DB.dates.length > 0; },
  // Ky bao cao: M | Q | Y
  period(d, per = 'M') {
    const y = d.slice(0, 4), m = +d.slice(5, 7); let m1, m2, label;
    if (per === 'Y') { m1 = 1; m2 = 12; label = 'Năm ' + y; } else if (per === 'Q') { const q = Math.ceil(m / 3); m1 = q * 3 - 2; m2 = q * 3; label = 'Quý ' + q + '/' + y; } else { m1 = m2 = m; label = 'Tháng ' + m + '/' + y; }
    const pm = x => y + '-' + String(x).padStart(2, '0');
    const from = pm(m1) + '-01', to = U.eom(pm(m2) + '-01');
    return { from, to, m1: pm(m1), m2: pm(m2), label, base: Mart.onOrBefore(U.addDays(from, -1)) || Mart.first(d) };
  },
  value(code, F, d) { if (!d) return 0; if (code === 'NV') return Mart.totals(d, 'D', F).bal; if (code === 'DN') return Mart.totals(d, 'L', F).bal; if (code === 'NPL') return Mart.totals(d, 'L', F).nplRatio; return 0; },
  flow(code, F, from, to) { if (code === 'XLRR') return Xlrr.recovered(F, from, to); if (code === 'DV') return Svc.sum(F, from, to); if (code === 'KQTC') return Fin.result(F, from, to).kq; if (code === 'DP') return Prov.expense(F, from, to); return 0; },
  // Toc do binh quan/ngay lam viec cua chi tieu luong trong cua so gan nhat
  rate(code, F, d) {
    const w = +DB.meta.flowWindow || 60; let from = U.addDays(d, -w + 1);
    // Moc dau cua so theo nguon du lieu cua chinh chi tieu: DV/XLRR co luong rieng; KQTC/DP phu thuoc so du
    const first = KPIX.firstDate(code); if (first && from < first) from = first;
    const n = Math.max(1, bizDays(U.addDays(from, -1), d)); return KPIX.flow(code, F, from, d) / n;
  },
  firstDate(code) {
    const mn = a => { let m = ''; for (const r of a || []) if (!m || r[0] < m) m = r[0]; return m; };
    if (code === 'DV') return mn(DB.svc) || DB.dates[0]; if (code === 'XLRR') return mn(DB.xlrr && DB.xlrr.tx) || DB.dates[0]; return DB.dates[0];
  },
  // So ngay lam viec co du lieu cua chi tieu trong cua so du bao (de danh gia do tin cay)
  histBiz(code, d) { const w = +DB.meta.flowWindow || 60; let from = U.addDays(d, -w + 1); const f = KPIX.firstDate(code); if (f && from < f) from = f; return bizDays(U.addDays(from, -1), d);
  },
  status(fc, plan, better) {
    if (plan === null || plan === undefined || !isFinite(plan) || fc === null) return { k: 'na', t: 'Chưa có KH' };
    const r = better === 'down' ? (fc <= plan ? 1 : plan / fc) : (plan > 0 ? fc / plan : (fc >= plan ? 1 : 0));
    return r >= 1 ? { k: 'ok', t: 'Dự kiến đạt' } : r >= 0.95 ? { k: 'risk', t: 'Nguy cơ' } : { k: 'bad', t: 'Không đạt' };
  },
  async eval(code, F, d, per = 'M') {
    const D = KPIX.def[code]; const P = KPIX.period(d, per); const out = { code, ...D, per: P, has: KPIX.has(code) };
    const soM = d.slice(0, 7) + '-01', soY = d.slice(0, 4) + '-01-01';
    if (D.type === 'bal') {
      out.actual = KPIX.value(code, F, d); out.base = KPIX.value(code, F, P.base); out.chg = out.actual - out.base;
      out.mtd = out.actual - KPIX.value(code, F, Mart.prevMonthEnd(d)); out.ytd = out.actual - KPIX.value(code, F, Mart.prevYearEnd(d));
      out.plan = Mart.plan(code, P.m2, F);
      const snap = await Store.snapshot(d); out.fc = Scenario.run(D.kind, F, d, snap, (DB.meta.scen || DEFAULTS.meta.scen).base, P.to).end; out.fcMethod = 'Kịch bản cơ sở (xu hướng + đáo hạn)';
      out.pct = out.plan ? out.actual / out.plan * 100 : null;
    } else if (D.type === 'ratio') {
      out.actual = KPIX.value(code, F, d); out.base = KPIX.value(code, F, P.base); out.chg = out.actual - out.base;
      out.mtd = out.actual - KPIX.value(code, F, Mart.prevMonthEnd(d)); out.ytd = out.actual - KPIX.value(code, F, Mart.prevYearEnd(d));
      const pl = Mart.plan('NPL', P.m2, F); out.plan = pl !== null ? pl : +DB.meta.nplMax || 2; out.planIsLimit = true;
      const i = DB.dates.indexOf(d); const ys = DB.dates.slice(Math.max(0, i - 29), i + 1).map(x => KPIX.value(code, F, x));
      // Chua du 5 ngay du lieu: khong ngoai suy (1 lan chuyen nhom se bi phong dai thanh xu huong gia)
      if (ys.length < 5) { out.fc = out.actual; out.fcMethod = `Giữ tỷ lệ hiện tại (mới có ${ys.length} ngày dữ liệu, cần ≥ 5 ngày để tính xu hướng)`; }
      else { out.fc = Math.max(0, out.actual + U.slope(ys) * bizDays(d, P.to)); out.fcMethod = 'Xu hướng tỷ lệ 30 ngày dữ liệu'; }
      out.pct = out.plan ? out.actual / out.plan * 100 : null;
    } else {
      const to = d; out.actual = KPIX.flow(code, F, P.from, to); out.mtd = KPIX.flow(code, F, soM, to); out.ytd = KPIX.flow(code, F, soY, to);
      out.plan = Mart.planFlow(code, P.m1, P.m2, F); out.chg = null;
      const rem = bizDays(d, P.to); const r = KPIX.rate(code, F, d); let extra = 0;
      if (code === 'XLRR') { const pp = Xlrr.pipeline(F, U.addDays(d, 1), P.to); extra = pp.expected; out.pipeline = pp; }
      out.fc = out.actual + r * rem * (code === 'XLRR' ? 0.5 : 1) + extra; // XLRR: chi tinh 50% toc do nen, phan con lai tu cam ket co xac suat
      out.fcMethod = code === 'XLRR' ? 'Thực thu + 50% tốc độ nền + cam kết × khả năng thu' : code === 'DP' ? 'Thực hiện + tốc độ bình quân ' + (DB.meta.flowWindow || 60) + ' ngày' : 'Run-rate ' + (DB.meta.flowWindow || 60) + ' ngày × ngày làm việc còn lại';
      // DP (va KQTC chiu anh huong DP): lich su < 5 ngay lam viec thi mot lan trich/hoan nhap la bien co, khong phai toc do -> khong nhan len
      const hb = KPIX.histBiz(code, d);
      if (code === 'DP' && hb < 5) { out.fc = out.actual; out.fcMethod = `Giữ số đã trích (mới có ${hb} ngày dữ liệu, chưa đủ để tính tốc độ)`; }
      if (code === 'KQTC' && hb < 5) { const dpA = Prov.expense(F, U.addDays(d, -(+DB.meta.flowWindow || 60) + 1), d); out.fc = out.actual + (r + dpA / Math.max(1, hb)) * rem; out.fcMethod = `Run-rate trước dự phòng × ngày còn lại; dự phòng giữ số đã trích (mới có ${hb} ngày dữ liệu)`; }
      out.pct = out.plan ? out.actual / out.plan * 100 : null; out.rem = rem; out.ratePerDay = r;
    }
    out.gap = out.plan !== null && out.plan !== undefined ? out.fc - out.plan : null;
    out.st = KPIX.status(out.fc, out.plan, D.better);
    out.hist = Mart.histDays(d);
    return out;
  },
  // Chuoi xu huong cua 1 KPI (so du/ty le: gia tri cuoi ngay; luong: luy ke theo thang)
  trend(code, F, d, n = 12) {
    const D = KPIX.def[code];
    if (D.type !== 'flow') { const ds = H.trendDates(d, n > 12 ? 'day' : 'month'); return ds.map(x => ({ x, l: 'T' + (+x.slice(5, 7)), v: KPIX.value(code, F, x) })); }
    const out = []; let m = d.slice(0, 7);
    const first = KPIX.firstDate(code); // thang truoc ngay dau tien co du lieu cua chinh chi tieu: khong ve (tranh ve thanh 0)
    for (let i = 0; i < n; i++) { const f = m + '-01'; if (!first || U.eom(f) < first) break; out.unshift({ x: m, l: 'T' + (+m.slice(5)), v: KPIX.flow(code, F, f, i === 0 ? d : U.eom(f)) }); m = U.addDays(f, -1).slice(0, 7); }
    return out;
  },
  // Don vi hien thi: so du -> ty dong; ty le -> %; chi tieu luong (DV, XLRR, KQTC, DP) -> trieu dong
  unit(code) { return code === 'NPL' ? '%' : KPIX.def[code] && KPIX.def[code].type === 'flow' ? 'trđ' : 'tỷ'; },
  num(code, v) { if (v === null || v === undefined || !isFinite(v)) return '—'; if (code === 'NPL') return U.num(v, 2); if (KPIX.def[code] && KPIX.def[code].type === 'flow') return U.num(v, Math.abs(v) < 100 ? 1 : 0); return U.tyA(v); },
  fmt(code, v) { const n = KPIX.num(code, v); return n === '—' ? n : n + (code === 'NPL' ? '%' : ' ' + KPIX.unit(code)); },
  sign(code, v) { if (v === null || v === undefined || !isFinite(v)) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + KPIX.num(code, Math.abs(v)) + (code === 'NPL' ? ' đpt' : ' ' + KPIX.unit(code)); },
};

/* =====================================================================
 *  WHY — "Tai sao?": phan ra bien dong theo cap to chuc + chieu nghiep vu
 *  Balance/ratio: so voi dau ky; Flow: ky nay so voi ky truoc cung do dai
 * ===================================================================== */
const Why = {
  async run(code, F, d, per = 'M') {
    const D = KPIX.def[code]; const P = KPIX.period(d, per); const res = { code, name: D.name, per: P };
    let cur, base, baseLabel;
    if (D.type === 'flow') {
      const len = U.diffDays(P.from, d); const pf = U.addDays(P.from, -1); const pFrom = U.addDays(pf, -len); // ky truoc cung so ngay
      cur = (FF) => KPIX.flow(code, FF, P.from, d); base = (FF) => KPIX.flow(code, FF, pFrom, pf); baseLabel = `${U.vnDate(pFrom)}–${U.vnDate(pf)} (kỳ trước cùng độ dài)`;
      res.range = [pFrom, pf, P.from, d];
    } else {
      cur = (FF) => KPIX.value(code, FF, d); base = (FF) => KPIX.value(code, FF, P.base); baseLabel = U.vnDate(P.base) + ' (đầu kỳ)';
    }
    res.baseLabel = baseLabel; res.total = { cur: cur(F), base: base(F) }; res.total.chg = res.total.cur - res.total.base;
    // --- Theo cap to chuc ---
    const ch = Mart.children(F); let rows = [];
    if (ch.level !== 'cust') rows = ch.items.map(it => ({ id: it.id, name: it.name, F: it.F, cur: cur(it.F), base: base(it.F), plan: D.type === 'flow' ? Mart.planFlow(code, P.m1, P.m2, it.F) : code === 'NPL' ? null : Mart.plan(code, P.m2, it.F) }));
    else rows = await Why.byCustomer(code, F, d, P, res);
    rows.forEach(r => { r.chg = r.cur - r.base; });
    rows.sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg));
    res.org = { name: ch.name, level: ch.level, rows };
    // --- Theo chieu nghiep vu ---
    res.dim = await Why.byDim(code, F, d, P, res);
    // Kiem tra khong double-count: tong cap con = tong (chi voi chi tieu cong duoc)
    if (code !== 'NPL' && ch.level !== 'cust') { const s = U.sum(rows, r => r.chg); res.check = Math.abs(s - res.total.chg) < Math.max(1, Math.abs(res.total.chg) * 1e-6); res.checkDiff = s - res.total.chg; }
    return res;
  },
  // Dong gop theo khach hang (dung cho Top dong gop o Tong quan)
  async custRows(code, F, d, per = 'M') {
    const P = KPIX.period(d, per); const res = {};
    if (KPIX.def[code].type === 'flow') { const len = U.diffDays(P.from, d), pf = U.addDays(P.from, -1); res.range = [U.addDays(pf, -len), pf, P.from, d]; }
    const rows = await Why.byCustomer(code, F, d, P, res); rows.forEach(r => { r.chg = r.cur - r.base; }); return rows;
  },
  async byCustomer(code, F, d, P, res) {
    const top = (m0, m1) => { const ids = new Set([...m0.keys(), ...m1.keys()]); return [...ids].map(id => ({ id, name: Cust.name(id), cur: m1.get(id) || 0, base: m0.get(id) || 0, cust: true })).sort((a, b) => Math.abs(b.cur - b.base) - Math.abs(a.cur - a.base)).slice(0, 20); };
    if (code === 'NV' || code === 'DN' || code === 'NPL') {
      const [s0, s1] = await Promise.all([Store.snapshot(P.base), Store.snapshot(d)]); const k = code === 'NV' ? 'D' : 'L';
      const f = (s) => { const m = new Map(); for (const [id, a] of Mart.custAgg(s, k, F)) m.set(id, code === 'NPL' ? a.npl : a.bal); return m; };
      if (code === 'NPL') res.nplNote = 'Cấp khách hàng hiển thị dư nợ xấu (triệu đồng), không phải tỷ lệ.';
      return top(f(s0), f(s1));
    }
    if (code === 'DV') { const [a, b, c, e] = res.range; return top(Svc.by(F, a, b, r => r[3]), Svc.by(F, c, e, r => r[3])); }
    if (code === 'XLRR') { const [a, b, c, e] = res.range; const cm = Xlrr.caseMap(); const toC = m => { const o = new Map(); for (const [k, v] of m) { const cs = cm.get(k); o.set(cs.c, (o.get(cs.c) || 0) + v); } return o; }; return top(toC(Xlrr.byCase(F, a, b)), toC(Xlrr.byCase(F, c, e))); }
    if (code === 'DP') {
      const [s0, s1] = await Promise.all([Store.snapshot(P.base), Store.snapshot(d)]); const f = s => { const m = new Map(); for (const [id, a] of Mart.custAgg(s, 'L', F)) m.set(id, a.pv); return m; };
      return top(f(s0), f(s1));
    }
    return [];
  },
  async byDim(code, F, d, P, res) {
    const mk = (name, rows) => ({ name, rows: rows.map(r => ({ ...r, chg: r.cur - r.base })).sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg)) });
    if (code === 'NV') { const g1 = Mart.groupAt(d, 'D', F, A.t), g0 = Mart.groupAt(P.base, 'D', F, A.t); return mk('Kỳ hạn', DICT.depTerms.map(([k, n]) => ({ id: k, name: n, cur: (g1.get(k) || { bal: 0 }).bal, base: (g0.get(k) || { bal: 0 }).bal, F: { ...F, term: k } }))); }
    if (code === 'DN') { const f = t => DICT.loanTermGroup[t]; const g1 = Mart.groupAt(d, 'L', F, A.t, f), g0 = Mart.groupAt(P.base, 'L', F, A.t, f); return mk('Nhóm kỳ hạn', ['NH', 'TH', 'DH'].map(k => ({ id: k, name: DICT.loanTermGroupName[k], cur: (g1.get(k) || { bal: 0 }).bal, base: (g0.get(k) || { bal: 0 }).bal, F: { ...F, term: 'G:' + k } }))); }
    if (code === 'NPL') { const a = Mart.totals(d, 'L', F), b = Mart.totals(P.base, 'L', F); return mk('Nhóm nợ xấu (triệu đồng)', [['3', 'g3'], ['4', 'g4'], ['5', 'g5']].map(([k, f]) => ({ id: k, name: LBL('debtGroups', k), cur: a[f], base: b[f] }))); }
    if (code === 'DV') { const [a, b, c, e] = res.range; const m0 = Svc.by(F, a, b, r => r[5]), m1 = Svc.by(F, c, e, r => r[5]); return mk('Nhóm dịch vụ', DICT.services.map(([k, n]) => ({ id: k, name: n, cur: m1.get(k) || 0, base: m0.get(k) || 0, F: { ...F, svc: k } }))); }
    if (code === 'XLRR') { const [a, b, c, e] = res.range; const cm = Xlrr.caseMap(); const toS = m => { const o = new Map(); for (const [k, v] of m) { const s = cm.get(k).status; o.set(s, (o.get(s) || 0) + v); } return o; }; const m0 = toS(Xlrr.byCase(F, a, b)), m1 = toS(Xlrr.byCase(F, c, e)); return mk('Trạng thái xử lý', DICT.xlrrStatus.map(([k, n]) => ({ id: k, name: n, cur: m1.get(k) || 0, base: m0.get(k) || 0 }))); }
    if (code === 'KQTC') { const [a, b, c, e] = res.range; const r0 = Fin.result(F, a, b), r1 = Fin.result(F, c, e); return { name: 'Khoản mục', rows: [['lai', r1.useFtp ? 'Contribution lãi (sau FTP)' : 'Thu nhập lãi thuần', 1], ['dv', 'Thu dịch vụ ròng', 1], ['thuKhac', 'Thu nhập khác', 1], ['cphd', 'Chi phí hoạt động', -1], ['dp', 'Chi phí dự phòng', -1]].map(([k, n, s]) => ({ id: k, name: n, cur: s * r1[k], base: s * r0[k], chg: s * (r1[k] - r0[k]) })) }; }
    if (code === 'DP') { const a = Prov.required(d, F), b = Prov.required(P.base, F); const rt = Prov.P().rates; return mk('Thành phần dự phòng', [{ id: 'spec', name: 'Dự phòng cụ thể', cur: a.spec, base: b.spec }, { id: 'gen', name: 'Dự phòng chung (' + Prov.P().general + '%)', cur: a.gen, base: b.gen }]); }
    return { name: '', rows: [] };
  },
};

/* =====================================================================
 *  OPP — Co hoi kinh doanh / thu hoi / hieu qua (chi dua ra khi co bang chung)
 * ===================================================================== */
const Opp = {
  async run(F, d) {
    if (!d) return [];
    const out = []; const sD = await Store.snapshot(d); const soY = d.slice(0, 4) + '-01-01';
    const dep = Mart.custAgg(sD, 'D', F), ln = Mart.custAgg(sD, 'L', F);
    // 1) Ban cheo dich vu: quan he lon nhung thu dich vu/quy mo thap (duoi phan vi 25 cua nhom quan he lon)
    if (Svc.has()) {
      const sv = Svc.by(F, soY, d, r => r[3]); const codes = new Map(); for (const r of DB.svc) if (r[0] >= soY && r[0] <= d && Svc.ok(r, F)) { if (!codes.has(r[3])) codes.set(r[3], new Set()); codes.get(r[3]).add(r[5]); }
      const rel = [...new Set([...dep.keys(), ...ln.keys()])].map(id => ({ id, rel: (dep.get(id) || { bal: 0 }).bal + (ln.get(id) || { bal: 0 }).bal, dv: sv.get(id) || 0 })).filter(x => x.rel > 0);
      rel.sort((a, b) => b.rel - a.rel); const big = rel.slice(0, Math.max(5, Math.ceil(rel.length * 0.3)));
      const ratios = big.map(x => x.dv / x.rel).sort((a, b) => a - b); const q25 = ratios[Math.floor(ratios.length * 0.25)] || 0, med = ratios[Math.floor(ratios.length / 2)] || 0;
      const days = Math.max(1, U.diffDays(soY, d) + 1);
      for (const x of big) if (x.dv / x.rel <= q25) {
        const used = codes.get(x.id) || new Set(); const missing = ['EBANK', 'THE', 'TTTN'].filter(k => !used.has(k));
        const pot = Math.max(0, (med - x.dv / x.rel) * x.rel) * 365 / days;
        if (pot > 0.5) out.push({ type: 'XSELL', kpi: 'DV', cust: x.id, value: pot, title: `Bán chéo dịch vụ cho ${Cust.name(x.id)}`, evidence: [['Quy mô quan hệ (NV + DN)', U.tyU(x.rel, 2)], ['Thu DV từ đầu năm', U.num(x.dv, 1) + ' trđ'], ['Tỷ lệ thu DV/quy mô', U.num(x.dv / x.rel * 1000, 2) + '‰ (trung vị nhóm: ' + U.num(med * 1000, 2) + '‰)'], ['Chưa dùng', missing.map(k => LBL('services', k)).join(', ') || '—']], rec: 'RM tư vấn gói dịch vụ phù hợp (' + (missing.map(k => LBL('services', k)).join(', ') || 'mở rộng dịch vụ hiện có') + ').', valueLabel: 'Thu DV tiềm năng/năm' });
      }
    }
    // 2) Giu chan tien gui den han 30 ngay
    const due = U.groupBy(Mart.maturing(sD, F, U.addDays(d, 1), U.addDays(d, 30)), r => r.c);
    for (const [c, rs] of due) { const v = U.sum(rs, r => r.b); if (v >= 2000) out.push({ type: 'RETAIN', kpi: 'NV', cust: c, value: v, title: `Tái tục ${U.tyU(v, 2)} tiền gửi đến hạn của ${Cust.name(c)}`, evidence: rs.slice(0, 3).map(r => [r.a + ' · ' + LBL('depTerms', r.t), U.tyU(r.b, 2) + ' · ' + U.vnDate(r.m)]), rec: 'Liên hệ trước ngày đến hạn; tư vấn kỳ hạn/lãi suất phù hợp trong thẩm quyền.', valueLabel: 'Số dư có thể giữ' }); }
    // 3) Thu hoi XLRR theo cam ket 30 ngay
    if (Xlrr.has()) for (const c of Xlrr.pipeline(F, U.addDays(d, -7), U.addDays(d, 30)).rows) out.push({ type: 'RECOVER', kpi: 'XLRR', cust: c.c, caseId: c.id, value: c.commit * c.prob / 100, title: `Đôn đốc thu ${U.num(c.commit, 0)} trđ theo cam kết (${c.id}) — ${Cust.name(c.c)}`, evidence: [['Còn phải thu', U.num(c.remaining, 0) + ' trđ'], ['Cam kết', U.num(c.commit, 0) + ' trđ · ' + U.vnDate(c.cdate)], ['Khả năng thu', c.prob + '%'], ['Trạng thái', LBL('xlrrStatus', c.status)]], rec: 'Cán bộ phụ trách liên hệ, chuẩn bị thủ tục thu/xử lý tài sản đúng hạn cam kết.', valueLabel: 'Thu kỳ vọng' });
    // 4) Thu hut dong tien: KH vay lon nhung tien gui rat thap
    for (const [id, l] of ln) { const dp = (dep.get(id) || { bal: 0 }).bal; if (l.bal >= 5000 && dp < l.bal * 0.05 && l.maxG === 1) out.push({ type: 'CASA', kpi: 'NV', cust: id, value: l.bal * 0.05 - dp, title: `Vận động ${Cust.name(id)} chuyển dòng tiền về tài khoản`, evidence: [['Dư nợ', U.tyU(l.bal, 2)], ['Tiền gửi', U.tyU(dp, 2)], ['Tỷ lệ TG/DN', U.pct(dp / l.bal * 100)]], rec: 'Đề xuất thu hộ/chi lương/thanh toán qua tài khoản để tăng CASA và giám sát dòng tiền trả nợ.', valueLabel: 'CASA tiềm năng (5% DN)' }); }
    const order = { RECOVER: 0, RETAIN: 1, XSELL: 2, CASA: 3 };
    return out.sort((a, b) => b.value - a.value || order[a.type] - order[b.type]);
  },
  TYPE: { XSELL: ['Bán chéo', 'DV'], RETAIN: ['Giữ chân tiền gửi', 'NV'], RECOVER: ['Thu hồi XLRR', 'XLRR'], CASA: ['Thu hút dòng tiền', 'NV'] },
};

/* =====================================================================
 *  FCHIST — luu du bao tai tung thoi diem de so voi thuc te (do sai so)
 * ===================================================================== */
const FcHist = {
  async record(d, evals) {
    if (!d || d !== DB.dates[DB.dates.length - 1] || !App.can('data')) return; // chi luu cho ngay moi nhat, nguoi co quyen du lieu
    const add = []; for (const e of evals) { if (!e || e.fc === null || e.fc === undefined || !e.has) continue; if ((DB.fch || []).some(x => x.made === d && x.kpi === e.code && x.target === e.per.to)) continue; add.push({ made: d, kpi: e.code, per: e.per.label, target: e.per.to, fc: Math.round(e.fc * 1000) / 1000, plan: e.plan, method: e.fcMethod, scope: 'ALL' }); }
    if (!add.length) return; DB.fch = [...(DB.fch || []), ...add].slice(-3000);
    try { await Store.save('fch', DB.fch); } catch (e) { /* bo qua */ }
  },
  // Danh sach du bao da luu kem thuc te (neu da den han)
  list() {
    return (DB.fch || []).map(x => { const D = KPIX.def[x.kpi]; if (!D) return null; let act = null; const last = DB.dates[DB.dates.length - 1];
      if (last && x.target <= last) { const e = Mart.onOrBefore(x.target); if (D.type === 'flow') { const P = KPIX.period(x.target, x.per.startsWith('Năm') ? 'Y' : x.per.startsWith('Quý') ? 'Q' : 'M'); act = KPIX.flow(x.kpi, {}, P.from, e); } else act = KPIX.value(x.kpi, {}, e); }
      return { ...x, name: D.name, act, err: act !== null && act ? (x.fc - act) / Math.abs(act) * 100 : null }; }).filter(Boolean).sort((a, b) => b.made.localeCompare(a.made));
  },
};

/* =====================================================================
 *  RULESX — engine rule cho cac tru cot moi (goi tu Rules.run)
 *  Moi canh bao: tieu de, bang chung, nguyen nhan, kien nghi, KH lien quan
 * ===================================================================== */
const RulesX = {
  async npl_new(r, F, d, S, out, base) {
    const mv = Quality.moves(S.sM, S.sD, F).filter(x => x.dir === 'down' && x.g >= 3 && x.g0 <= 2); const v = U.sum(mv, x => x.b);
    if (v > +r.threshold) out.push({ ...base, id: r.id + '-' + d, title: `${U.tyU(v, 2)} nợ chuyển sang nợ xấu từ đầu tháng`, evidence: [['Số hợp đồng', mv.length], ['Số khách hàng', new Set(mv.map(x => x.c)).size], ['Ngưỡng rule', U.tyU(+r.threshold)]], cause: mv.slice(0, 4).map(x => [Cust.name(x.c) + ` (N${x.g0}→N${x.g})`, -x.b]), rec: 'Rà soát hồ sơ, xác định nguyên nhân chuyển nhóm; lập phương án thu hồi/cơ cấu và đánh giá tác động trích lập dự phòng.', refs: [...new Set(mv.map(x => x.c))].slice(0, 5) });
  },
  async ews(r, F, d, S, out, base) {
    const sig = Quality.ews(S.sD, S.sM, F).filter(x => x.sev !== 'low'); const cs = [...new Set(sig.map(x => x.c))];
    if (cs.length >= +r.threshold && sig.length) out.push({ ...base, id: r.id + '-' + d, title: `${cs.length} khách hàng có tín hiệu cảnh báo sớm (EWS)`, evidence: [...U.groupBy(sig, x => x.type)].map(([k, v]) => [Quality.EWS_NAME[k] || k, v.length + ' tín hiệu']), cause: sig.slice(0, 4).map(x => [Cust.name(x.c) + ': ' + x.text, -x.amt]), rec: 'Tín hiệu sớm, KHÔNG phải kết luận phân loại nợ. RM xác minh tình hình khách hàng trong SLA và cập nhật phản hồi.', refs: cs.slice(0, 5) });
  },
  async kpi_fc(r, F, d, S, out, base) {
    if (!KPIX.has(r.kpi)) return; const e = await KPIX.eval(r.kpi, F, d, 'M'); if (!e.plan) return;
    const pc = e.fc / e.plan * 100; const bad = e.better === 'down' ? pc > +r.threshold : pc < +r.threshold; if (!bad) return;
    const w = await Why.run(r.kpi, F, d, 'M'); const drv = w.org.rows.filter(x => e.better === 'down' ? x.chg > 0 : x.chg < 0).slice(0, 3);
    out.push({ ...base, id: r.id + '-' + d, kpi: r.kpi, title: `Dự báo ${e.name.charAt(0).toLowerCase() + e.name.slice(1)} ${e.per.label.toLowerCase()} đạt ${U.pct(pc)} kế hoạch`, evidence: [['Thực hiện đến ' + U.vnDate(d), KPIX.fmt(r.kpi, e.actual)], ['Kế hoạch kỳ', KPIX.fmt(r.kpi, e.plan)], ['Dự báo cuối kỳ', KPIX.fmt(r.kpi, e.fc)], ['Gap dự báo', KPIX.sign(r.kpi, e.gap)], ['Phương pháp', e.fcMethod]], cause: drv.map(x => [x.name + ' (so với kỳ trước)', x.chg]), rec: e.better === 'down' ? 'Rà soát các khoản làm tăng trích lập; ưu tiên thu hồi/cơ cấu để hạn chế chuyển nhóm.' : `Cần thêm khoảng ${KPIX.fmt(r.kpi, Math.max(0, -e.gap) / Math.max(1, e.rem || 1))}/ngày làm việc. Giao chỉ tiêu bổ sung cho đơn vị/cán bộ giảm mạnh nhất (xem "Nguyên nhân").`, refs: [] });
  },
  async xlrr_commit(r, F, d, S, out, base) {
    if (!Xlrr.has()) return; const od = Xlrr.overdueCommits(F, d); if (od.length <= +r.threshold) return;
    out.push({ ...base, id: r.id + '-' + d, title: `${od.length} hồ sơ XLRR quá hạn cam kết nhưng chưa thu`, evidence: od.slice(0, 5).map(c => [c.id + ' · ' + Cust.name(c.c), U.tyU(c.commit, 2) + ' · hạn ' + U.vnDate(c.cdate)]), cause: [], rec: 'Cán bộ phụ trách làm việc lại với khách hàng, cập nhật cam kết mới hoặc chuyển biện pháp xử lý (khởi kiện/xử lý TSBĐ).', refs: [...new Set(od.map(c => c.c))].slice(0, 5) });
  },
};

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }

    };

    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + g} ${r + g}h1v1h-1z`;

  },

  /* ------------------------------ Bieu do duong (SVG, cham de xem so) ------------------------------ */
  line(pts, { fmt, unit, color = 'var(--m-brand)' } = {}) {
    if (pts.length < 2) return '<p class="m-muted">Chưa đủ dữ liệu để vẽ xu hướng</p>';
    const W = 340, Hh = 170, pl = 8, pr = 8, pt = 16, pb = 24; const vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo -= 1; hi += 1; } const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    const x = i => pl + (W - pl - pr) * i / (pts.length - 1), y = v => pt + (Hh - pt - pb) * (1 - (v - lo) / (hi - lo));
    const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    const area = path + ` L${x(pts.length - 1).toFixed(1)} ${Hh - pb} L${x(0).toFixed(1)} ${Hh - pb} Z`;
    const grid = [0.25, 0.5, 0.75].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${(pt + (Hh - pt - pb) * f).toFixed(1)}" y2="${(pt + (Hh - pt - pb) * f).toFixed(1)}" class="g"/>`).join('');
    const li = pts.length - 1; const ticks = [0, Math.floor(li / 2), li].map(i => `<text x="${x(i).toFixed(1)}" y="${Hh - 6}" text-anchor="${i === 0 ? 'start' : i === li ? 'end' : 'middle'}">${M.esc(pts[i].l)}</text>`).join('');
    const id = 'ln' + Math.random().toString(36).slice(2, 7);
    M._ln = M._ln || {}; M._ln[id] = { pts, fmt, unit, x, y, W, Hh, pt, pb };
    return `<div class="m-line" data-ln="${id}"><div class="m-tip" aria-live="polite"><b>${M.esc(fmt(pts[li].v))}</b><small>${M.esc(pts[li].full || pts[li].l)} · mới nhất</small></div>
      <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Biểu đồ xu hướng, giá trị mới nhất ${M.esc(fmt(pts[li].v))}"><defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path d="${area}" fill="url(#g${id})"/><path d="${path}" class="l" style="stroke:${color}"/>
      <line class="xh" x1="0" x2="0" y1="${pt}" y2="${Hh - pb}" hidden/><circle class="dot" r="4.5" cx="${x(li).toFixed(1)}" cy="${y(pts[li].v).toFixed(1)}" style="fill:${color}"/>${ticks}
      <rect class="hit" x="0" y="0" width="${W}" height="${Hh}" fill="transparent"/></svg></div>`;
  },
  bindLines(root) {
    root.querySelectorAll('[data-ln]').forEach(box => {
      const L = M._ln[box.dataset.ln]; if (!L) return; const svg = box.querySelector('svg'), tip = box.querySelector('.m-tip'), dot = svg.querySelector('.dot'), xh = svg.querySelector('.xh');
      const show = cx => { const r = svg.getBoundingClientRect(); const px = (cx - r.left) / r.width * L.W; let bi = 0, bd = 1e9; L.pts.forEach((p, i) => { const dd = Math.abs(L.x(i) - px); if (dd < bd) { bd = dd; bi = i; } });
        const p = L.pts[bi]; dot.setAttribute('cx', L.x(bi)); dot.setAttribute('cy', L.y(p.v)); xh.setAttribute('x1', L.x(bi)); xh.setAttribute('x2', L.x(bi)); xh.hidden = false;
        tip.innerHTML = `<b>${M.esc(L.fmt(p.v))}</b><small>${M.esc(p.full || p.l)}</small>`; };
      svg.addEventListener('pointerdown', e => { show(e.clientX); svg.setPointerCapture && svg.setPointerCapture(e.pointerId); });
      svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') show(e.clientX); });
    });
  },
  drawTrend() {
    const c = document.getElementById('tr-c'); if (!c) return; const k = M.trendK;
    const ds = DB.dates.filter(x => x <= M.F.date).slice(-30);
    const pts = ds.map(d => ({ l: U.vnDate(d).slice(0, 5), full: U.vnDate(d), v: KPIX.value(k, M.F, d) }));
    const fmt = v => KPIX.fmt(k, v); const first = pts[0], last = pts[pts.length - 1];
    const ch = first && last ? last.v - first.v : 0;
    c.innerHTML = M.line(pts, { fmt, color: k === 'NPL' ? 'var(--m-bad)' : k === 'DN' ? 'var(--m-blue)' : 'var(--m-green)' }) +
      (first ? `<p class="m-cap">30 ngày làm việc gần nhất: <b class="tnum">${KPIX.sign(k, ch)}</b> (${U.vnDate(ds[0])} → ${U.vnDate(ds[ds.length - 1])})</p>` : '');
    M.bindLines(c);
  },

  /* ------------------------------ Bang truot (bottom sheet) ------------------------------ */
  sheet(html) {
    const s = document.getElementById('m-sheet'); s.innerHTML = `<div class="m-grab" aria-hidden="true"></div><button class="m-icbtn m-sx" aria-label="Đóng">${M.ic('x')}</button><div class="m-sc">${html}</div>`;
    document.body.classList.add('m-sheet-on'); s.querySelector('.m-sx').onclick = M.closeSheet;
    let y0 = null; s.addEventListener('touchstart', e => { if (s.querySelector('.m-sc').scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
    s.addEventListener('touchmove', e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) s.style.transform = `translateY(${dy}px)`; }, { passive: true });
    s.addEventListener('touchend', e => { if (y0 === null) return; const dy = (e.changedTouches[0].clientY - y0); s.style.transform = ''; y0 = null; if (dy > 90) M.closeSheet(); });
    return s;
  },
  closeSheet() { document.body.classList.remove('m-sheet-on'); },
  orgSheet() {
    const S = Mart.scope(); if (S.unit) return;
    const brs = S.cn ? DB.branches.filter(b => b.id === S.cn) : DB.branches;
    const s = M.sheet(`<h3>Chọn đơn vị</h3>${S.cn ? '' : `<button class="m-opt ${M.F.cn === 'ALL' && M.F.unit === 'ALL' ? 'on' : ''}" data-o="ALL:ALL">Toàn chi nhánh</button>`}
      ${brs.map(b => `<div class="m-og"><button class="m-opt b ${M.F.cn === b.id && M.F.unit === 'ALL' ? 'on' : ''}" data-o="${M.esc(b.id)}:ALL">${M.esc(b.name)}</button>
        ${DB.units.filter(u => u.cn === b.id && u.id !== b.id).map(u => `<button class="m-opt u ${M.F.unit === u.id ? 'on' : ''}" data-o="${M.esc(b.id)}:${M.esc(u.id)}">${M.esc(u.name)}</button>`).join('')}
        ${DB.unitMap.has(b.id) ? `<button class="m-opt u ${M.F.unit === b.id ? 'on' : ''}" data-o="${M.esc(b.id)}:${M.esc(b.id)}">Trụ sở ${M.esc(b.name.replace(/^Chi nhánh\s*/i, ''))}</button>` : ''}</div>`).join('')}`);
    s.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const [cn, un] = b.dataset.o.split(':'); M.F.cn = cn; M.F.unit = un; M.cache.clear(); M.closeSheet(); M.syncBar(); M.badges(); M.go(M.tab); });
  },
  async kpiSheet(code) {
    const ev = await M.evals(); const e = ev.find(x => x.code === code); if (!e) return; const d = M.F.date;
    const pv = e.pct, t = M.tone(e.better, pv);
    const rows = [['Kế hoạch' + (e.planIsLimit ? ' (ngưỡng)' : ''), KPIX.fmt(code, e.plan)], ['Thực hiện', KPIX.fmt(code, e.actual)], [e.better === 'down' ? 'Mức sử dụng ngưỡng' : '% hoàn thành', M.pct(pv, 1)],
      ...(e.type !== 'flow' ? [['So đầu kỳ (' + e.per.label + ')', KPIX.sign(code, e.chg)], ['So đầu tháng', KPIX.sign(code, e.mtd)], ['So đầu năm', KPIX.sign(code, e.ytd)]] : [['Lũy kế tháng', KPIX.fmt(code, e.mtd)], ['Lũy kế năm', KPIX.fmt(code, e.ytd)]]),
      ['Dự báo cuối kỳ', KPIX.fmt(code, e.fc)], ['Chênh lệch dự báo – KH', e.gap === null ? '—' : KPIX.sign(code, e.gap)]];
    let pts;
    if (e.type === 'flow') pts = KPIX.trend(code, M.F, d, 12).map(p => ({ l: p.l, full: 'Tháng ' + p.x.slice(5) + '/' + p.x.slice(0, 4), v: p.v }));
    else pts = DB.dates.filter(x => x <= d).slice(-60).map(x => ({ l: U.vnDate(x).slice(0, 5), full: U.vnDate(x), v: KPIX.value(code, M.F, x) }));
    const s = M.sheet(`<div class="m-sh-h"><h3>${M.esc(e.name)}</h3>${M.stChip(e.st)}</div><div class="m-kv big tnum">${KPIX.num(code, e.actual)}<small>${KPIX.unit(code)}</small></div>
      ${t ? `<div class="m-kpi t-${t} flat"><div class="m-bar"><i style="width:${Math.max(2, Math.min(100, pv))}%"></i></div><div class="m-kf"><span>${M.esc(e.per.label)}</span><span class="m-tt">${M.TT[t]}</span></div></div>` : ''}
      <dl class="m-dl">${rows.map(([a, b]) => `<dt>${M.esc(a)}</dt><dd class="tnum">${M.esc(b)}</dd>`).join('')}</dl>
      <h4>${e.type === 'flow' ? 'Lũy kế theo tháng' : 'Diễn biến 60 ngày làm việc'}</h4>${M.line(pts, { fmt: v => KPIX.fmt(code, v), color: code === 'NPL' || code === 'DP' ? 'var(--m-bad)' : 'var(--m-brand)' })}
      <p class="m-cap"><b>Phương pháp dự báo:</b> ${M.esc(e.fcMethod || '')}</p>`);
    M.bindLines(s);
  },
  actSheet(id) {
    const a = DB.actions.find(x => x.id === id); if (!a) return; const ST = Object.fromEntries(DICT.actionStatus), FB = Object.fromEntries(DICT.feedback || []);
    const r = DB.rmMap.get(a.owner || a.ownerRm);
    M.sheet(`<div class="m-sh-h"><h3>${M.esc(a.title)}</h3><span class="m-as s-${M.esc(a.status)}">${M.esc(ST[a.status] || a.status)}</span></div>
      <dl class="m-dl"><dt>Khách hàng</dt><dd>${M.esc(Cust.name(a.cust) || '—')}</dd><dt>Đơn vị</dt><dd>${M.esc((DB.unitMap.get(a.unit) || {}).name || '—')}</dd><dt>Người thực hiện</dt><dd>${M.esc(a.assigneeName || (r ? r.name : a.owner || '—'))}</dd>
        <dt>Chỉ tiêu</dt><dd>${M.esc(KPIX.def[a.kpi] ? KPIX.def[a.kpi].name : a.kpi || '—')}</dd><dt>Ngày giao</dt><dd>${a.created ? U.vnDate(a.created) : '—'}</dd><dt>Hạn xử lý</dt><dd>${a.due ? U.vnDate(a.due) : '—'}</dd>
        ${a.feedback ? `<dt>Phản hồi</dt><dd>${M.esc(FB[a.feedback] || a.feedback)}</dd>` : ''}</dl>
      ${a.fbNote ? `<p class="m-rec">${M.esc(a.fbNote)}</p>` : ''}${a.note ? `<p class="m-rec"><b>Ghi chú:</b> ${M.esc(a.note)}</p>` : ''}
      ${(a.hist || []).length ? `<h4>Lịch sử</h4><ol class="m-hist">${a.hist.slice().reverse().map(h => `<li><b>${M.esc(h.ev || '')}</b><small>${M.esc(h.by || '')} · ${h.t ? M.esc(U.vnDate(String(h.t).slice(0, 10))) : ''}</small></li>`).join('')}</ol>` : ''}`);
  },
};

document.addEventListener('DOMContentLoaded', () => M.start());

</script>
</body>
</html>
